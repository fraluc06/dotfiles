theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = true
true-color = true
bufferline = "multiple"
color-modes = true
auto-format = true
auto-save = false
completion-trigger-len = 1
cursorline = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "register", "position", "position-percentage", "file-encoding", "file-line-ending", "file-type"]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.indent-guides]
render = true
character = "┊"

[editor.whitespace.render]
newline = "none"
space = "none"
tab = "all"

[editor.whitespace.characters]
nbsp = "•"
tab = "→"

[editor.file-picker]
hidden = false

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
