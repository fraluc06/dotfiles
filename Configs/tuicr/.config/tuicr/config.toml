# Main settings
appearance = "system"
theme_dark = "catppuccin-mocha"
theme_light = "catppuccin-latte"

# Diff layout and behavior
diff_view = "unified"
ignore_whitespace = false
show_file_list = true
show_commits = true
mouse = true
leader = ";"
wrap = false
relative_line_numbers = false
cursor_line = true
transparent_background = true
scroll_offset = 5
no_update_check = false
review_watch_interval_ms = 1000
single_file_view = false

# Comment settings & editor
comment_vim = false
comment_tab_width = 4

# Backend
backend = "libgit2"

# Comment types (conventional comments)
comment_types = [
  { id = "note", label = "question", definition = "ask for clarification", color = "yellow" },
  { id = "suggestion", definition = "possible improvements", color = "cyan" },
  { id = "issue", definition = "problems to fix", color = "red" },
  { id = "praise", definition = "positive feedback", color = "green" },
  { id = "nit", label = "nitpick", definition = "small optional tweaks", color = "#d19a66" },
]

[forge]
comment_type_prefix = true

[export]
intro = "I reviewed your code and have the following comments. Please address them."
scope_line = true
pr_metadata = true
comments_header = "## Local tuicr Comments"
remote_comments_header = "## Existing GitHub Comments"
legend = true
