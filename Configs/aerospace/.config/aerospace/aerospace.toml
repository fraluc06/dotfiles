# Niri-style keybindings for AeroSpace

start-at-login = true
after-login-command = []
after-startup-command = []

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]

# ══════════════════════════════════════════════════════════════════
# Applications
# ══════════════════════════════════════════════════════════════════
cmd-enter = 'exec-and-forget open -na Ghostty'
cmd-shift-enter = ['exec-and-forget open -na Ghostty', 'layout floating']
cmd-shift-f = 'exec-and-forget open -a Finder'
cmd-shift-e = 'exec-and-forget open -a TextEdit'
alt-f2 = 'exec-and-forget open -a Terminal'

# ══════════════════════════════════════════════════════════════════
# Window Management
# ══════════════════════════════════════════════════════════════════
alt-q = 'close'
alt-f = 'fullscreen'
alt-b = 'balance-sizes'

# Toggle floating/tiling (moved to alt)
alt-space = 'layout floating tiling'
alt-shift-space = 'focus-back-and-forth'

# Toggle between layouts
alt-w = 'layout accordion horizontal'
alt-e = 'layout tiles horizontal vertical'
alt-t = 'layout tiles horizontal vertical accordion'
alt-shift-t = ['layout tiling', 'flatten-workspace-tree']

# Focus movement (arrows only - vim keys conflict with macOS)
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Vim-style with alt modifier instead
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# Focus first/last
alt-home = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace left'
alt-end = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace right'

# ══════════════════════════════════════════════════════════════════
# Monitor focus
# ══════════════════════════════════════════════════════════════════
cmd-shift-left = 'focus-monitor left'
cmd-shift-right = 'focus-monitor right'
cmd-shift-up = 'focus-monitor up'
cmd-shift-down = 'focus-monitor down'

alt-shift-h = 'focus-monitor left'
alt-shift-j = 'focus-monitor down'
alt-shift-k = 'focus-monitor up'
alt-shift-l = 'focus-monitor right'

# Move window to monitor
cmd-shift-ctrl-left = 'move-node-to-monitor left'
cmd-shift-ctrl-right = 'move-node-to-monitor right'
cmd-shift-ctrl-up = 'move-node-to-monitor up'
cmd-shift-ctrl-down = 'move-node-to-monitor down'

alt-shift-ctrl-h = 'move-node-to-monitor left'
alt-shift-ctrl-j = 'move-node-to-monitor down'
alt-shift-ctrl-k = 'move-node-to-monitor up'
alt-shift-ctrl-l = 'move-node-to-monitor right'

# ══════════════════════════════════════════════════════════════════
# Workspace navigation
# ══════════════════════════════════════════════════════════════════
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-ctrl-1 = 'move-node-to-workspace 1'
alt-ctrl-2 = 'move-node-to-workspace 2'
alt-ctrl-3 = 'move-node-to-workspace 3'
alt-ctrl-4 = 'move-node-to-workspace 4'
alt-ctrl-5 = 'move-node-to-workspace 5'
alt-ctrl-6 = 'move-node-to-workspace 6'
alt-ctrl-7 = 'move-node-to-workspace 7'
alt-ctrl-8 = 'move-node-to-workspace 8'
alt-ctrl-9 = 'move-node-to-workspace 9'

# Previous/next workspace
alt-pageUp = 'workspace prev'
alt-pageDown = 'workspace next'
alt-u = 'workspace prev'
alt-i = 'workspace next'

# Move window to prev/next workspace
alt-ctrl-pageUp = 'move-node-to-workspace prev'
alt-ctrl-pageDown = 'move-node-to-workspace next'
alt-ctrl-u = 'move-node-to-workspace prev'
alt-ctrl-i = 'move-node-to-workspace next'

# Switch to previous workspace
alt-tab = 'workspace-back-and-forth'

# ══════════════════════════════════════════════════════════════════
# Column/window operations
# ══════════════════════════════════════════════════════════════════
alt-leftSquareBracket = 'join-with left'
alt-rightSquareBracket = 'join-with right'
alt-comma = 'join-with down'
alt-period = 'move right'

# ══════════════════════════════════════════════════════════════════
# Resize
# ══════════════════════════════════════════════════════════════════
alt-minus = 'resize width -50'
alt-equal = 'resize width +50'
alt-shift-minus = 'resize height -50'
alt-shift-equal = 'resize height +50'

alt-g = 'resize smart -100'
alt-shift-g = 'resize smart +100'
alt-ctrl-g = 'balance-sizes'

# ══════════════════════════════════════════════════════════════════
# Misc
# ══════════════════════════════════════════════════════════════════
alt-shift-slash = 'exec-and-forget osascript -e "display dialog \"AeroSpace Hotkeys\" buttons {\"OK\"}"'
alt-o = 'exec-and-forget open -a "Mission Control"'
# ctrl-alt-l = 'exec-and-forget pmset displaysleepnow'

# Reload config
alt-shift-c = 'reload-config'

# ══════════════════════════════════════════════════════════════════
# Resize mode
# ══════════════════════════════════════════════════════════════════
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
left = 'resize width -50'
right = 'resize width +50'
down = 'resize height +50'
up = 'resize height -50'
enter = 'mode main'
esc = 'mode main'